name: kalshi-paper-maker

# Runs on GitHub's servers on NFL game days; no local machine needed.
# Each run: place paper orders for games kicking off in the next 6h / 1h, fill orders for games that have kicked off
# (from Kalshi's real trade tape), settle finalized markets, rewrite paper/SUMMARY.md, and commit the state back.
on:
  schedule:
    - cron: "*/20 16-23 * * 4"   # Thursday (UTC) - TNF window incl. T-6h
    - cron: "*/20 0-5 * * 5"     # Thursday night games (UTC Friday)
    - cron: "0 6-23/3 * * 5"     # Friday (holiday games) - light
    - cron: "*/20 14-23 * * 6"   # Saturday (late-season games)
    - cron: "*/20 0-4 * * 0"     # Saturday night games (UTC Sunday)
    - cron: "*/20 7-23 * * 0"    # Sunday incl. London 9:30am ET kickoffs (T-6h = ~07:30 UTC)
    - cron: "*/20 0-5 * * 1"     # Sunday night game (UTC Monday)
    - cron: "*/20 18-23 * * 1"   # Monday
    - cron: "*/20 0-5 * * 2"     # Monday night game (UTC Tuesday)
    - cron: "0 */3 * * 2,3"      # Tue/Wed: settle stragglers, catch unusual kickoffs
  workflow_dispatch:

concurrency:
  group: paper-maker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Paper market-maker (place, fill, settle, summarize)
        run: uv run --no-project --python 3.12 --with requests python paper/kalshi_maker.py
      - name: Surprise-inactive receiver unders (snapshot ~T-85, grade after game)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: uv run --no-project --python 3.12 --with requests --with pandas --with pyarrow python paper/targets_freed.py
      - name: Commit state
        run: |
          git config user.name "paper-maker-bot"
          git config user.email "paper-maker-bot@users.noreply.github.com"
          git add paper/state paper/SUMMARY.md paper/TARGETS_FREED.md
          git diff --cached --quiet || (git commit -m "paper maker: $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase && git push)
